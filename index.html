<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A0E27">
<meta name="description" content="De tas de ferraille à légende. Construisez un robot de combat et écrivez sa légende dans les arènes.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Robot Chronicle">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Robot Chronicle</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0A0E27}
  #frame{width:100%;height:100%;border:0;display:block}

  #boot{
    position:fixed;inset:0;background:#0A0E27;z-index:10;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Fira Code',monospace;color:#00F0FF;
    transition:opacity .4s;
  }
  #boot .robot{font-size:64px;margin-bottom:14px;
    filter:drop-shadow(0 0 30px rgba(0,240,255,.3))}
  #boot .txt{font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.6}
  #boot.hidden{opacity:0;pointer-events:none}

  #update{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    display:none;align-items:center;gap:12px;
    padding:12px 18px;border-radius:12px;z-index:20;
    background:rgba(10,14,39,.96);border:1px solid #F7E018;
    box-shadow:0 0 24px rgba(247,224,24,.25);
    font-family:'Fira Code',monospace;font-size:11px;color:#F7E018;
    white-space:nowrap;
  }
  #update button{
    padding:7px 14px;border:0;border-radius:8px;cursor:pointer;
    background:#F7E018;color:#0A0E27;
    font-family:inherit;font-size:11px;font-weight:700;
  }
</style>
</head>
<body>

<div id="boot">
  <div class="robot">🤖</div>
  <div class="txt">Chargement…</div>
</div>

<div id="update">
  <span>Nouvelle version disponible</span>
  <button onclick="applyUpdate()">Mettre à jour</button>
</div>

<iframe id="frame" src="./robot-chronicle.html" title="Robot Chronicle"></iframe>

<script>
// ----------------------------------------------------------------
// Masquage de l'écran de démarrage une fois le jeu chargé
// ----------------------------------------------------------------
var frame = document.getElementById('frame');
var boot  = document.getElementById('boot');

var bootGone = false;
function hideBoot() {
  if (bootGone) return;
  bootGone = true;
  boot.classList.add('hidden');
  setTimeout(function () { boot.style.display = 'none'; }, 400);
}
frame.addEventListener('load', hideBoot);

// Si l'iframe est déjà chargée (cache, retour arrière), l'événement
// 'load' est PASSÉ avant que l'écouteur soit posé : le voile resterait
// alors affiché et bloquerait tous les taps sur le jeu.
try {
  var d = frame.contentDocument;
  if (d && d.readyState === 'complete') hideBoot();
} catch (e) { /* même origine attendue, on ignore */ }

setTimeout(hideBoot, 2500);   // filet de sécurité, raccourci

// ----------------------------------------------------------------
// Service worker : enregistrement et détection de mise à jour
// ----------------------------------------------------------------
var waitingWorker = null;

function applyUpdate() {
  if (waitingWorker) waitingWorker.postMessage('SKIP_WAITING');
  document.getElementById('update').style.display = 'none';
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js')
      .then(function (reg) {

        // Une mise à jour est déjà en attente au chargement
        if (reg.waiting) {
          waitingWorker = reg.waiting;
          document.getElementById('update').style.display = 'flex';
        }

        // Une mise à jour arrive pendant la session
        reg.addEventListener('updatefound', function () {
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function () {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              waitingWorker = nw;
              document.getElementById('update').style.display = 'flex';
            }
          });
        });

        // Vérification périodique (toutes les 30 minutes)
        setInterval(function () { reg.update(); }, 30 * 60 * 1000);
      })
      .catch(function (err) {
        console.warn('Service worker non enregistré :', err);
      });

    // Rechargement une fois le nouveau worker actif
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  });
}
</script>

</body>
</html>
